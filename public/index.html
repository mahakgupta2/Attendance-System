<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unified Attendance Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
    }
    .gradient-text {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .toggle-view { transition: all 0.4s ease-in-out; }
    .hidden-view { opacity: 0; pointer-events: none; position: absolute; transform: scale(0.95); left: 0; right: 0; }
    .active-view { opacity: 1; pointer-events: auto; position: relative; transform: scale(1); }
    .tab-btn {
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(236, 72, 153, 0.2));
      border-color: rgba(236, 72, 153, 0.5);
      color: white;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.2);
    }
  </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4 md:p-6 relative overflow-x-hidden overflow-y-auto" style="background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);">
  
  <!-- Blobs -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-purple-600 rounded-full mix-blend-screen filter blur-[100px] opacity-40 animate-pulse"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-pink-600 rounded-full mix-blend-screen filter blur-[100px] opacity-40 animate-pulse" style="animation-delay: 2s;"></div>

  <!-- Container -->
  <div class="glass-card w-full max-w-md p-5 shadow-2xl relative z-10 flex flex-col items-center my-2">
    
    <div class="text-center mb-3 w-full">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-gradient-to-br from-purple-500 to-pink-500 rounded-2xl shadow-lg mb-2 transform -rotate-3">
        <span class="text-xl">🔑</span>
      </div>
      <h1 class="text-2xl font-extrabold mb-1 gradient-text tracking-tight">Unified Portal</h1>
      <p class="text-gray-400 text-xs font-medium">Select your role to authenticate</p>
    </div>

    <!-- Tab Switcher -->
    <div class="flex gap-2 w-full mb-4">
      <button id="tabStudent" onclick="switchRole('student')" class="tab-btn active w-1/2 py-2.5 rounded-xl text-sm font-bold tracking-wide border border-slate-700 bg-slate-900/40 text-gray-400">
        🎓 Student
      </button>
      <button id="tabAdmin" onclick="switchRole('admin')" class="tab-btn w-1/2 py-2.5 rounded-xl text-sm font-bold tracking-wide border border-slate-700 bg-slate-900/40 text-gray-400">
        🛡️ Admin
      </button>
    </div>
    
    <div class="relative w-full">
      <!-- Student View -->
      <div id="student-view" class="toggle-view active-view w-full">
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-purple-300 uppercase tracking-wider mb-1">Student ID Roll No.</label>
            <input type="text" id="studentId" autocomplete="off" placeholder="e.g. S123456" class="w-full bg-slate-900/60 text-white px-4 py-2.5 rounded-xl border border-purple-500/30 focus:outline-none focus:border-pink-500 transition-all font-mono tracking-widest uppercase">
          </div>
          <div>
            <label class="block text-xs font-semibold text-purple-300 uppercase tracking-wider mb-1">Password</label>
            <input type="password" id="studentPass" placeholder="••••••••" class="w-full bg-slate-900/60 text-white px-4 py-2.5 rounded-xl border border-purple-500/30 focus:outline-none focus:border-pink-500 transition-all font-mono tracking-widest">
          </div>

          <button onclick="studentLogin()" id="studentBtn" class="w-full bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-500 hover:to-pink-400 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg mt-2 transition-transform transform hover:-translate-y-0.5 uppercase tracking-wider text-sm">
            Authenticate
          </button>
          
          <div class="h-6 flex items-center justify-center mt-2">
            <p id="studentMsg" class="text-center text-sm font-bold"></p>
          </div>

          <!-- Quick Actions -->
          <div class="mt-1 pt-3 border-t border-white/10 w-full">
            <h3 class="text-[10px] font-semibold text-gray-400 uppercase tracking-widest text-center mb-2">Quick Actions</h3>
            <div class="flex justify-center">
              <a href="/register.html" class="w-full bg-slate-900/60 hover:bg-slate-800/80 text-blue-400 font-bold py-2.5 px-2 rounded-xl shadow-lg transition-transform transform hover:-translate-y-0.5 text-center text-[11px] uppercase tracking-wider flex flex-row items-center justify-center gap-3 border border-blue-500/20">
                <span class="text-xl filter drop-shadow">📝</span>
                Register New Student
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Admin Login View -->
      <div id="admin-view" class="toggle-view hidden-view w-full">
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-purple-300 uppercase tracking-wider mb-1">Username</label>
            <input type="text" id="adminUser" autocomplete="off" placeholder="Enter username" class="w-full bg-slate-900/60 text-white px-4 py-2.5 rounded-xl border border-purple-500/30 focus:outline-none focus:border-pink-500 transition-all font-mono text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-purple-300 uppercase tracking-wider mb-1">Password</label>
            <input type="password" id="adminPass" placeholder="••••••••" class="w-full bg-slate-900/60 text-white px-4 py-2.5 rounded-xl border border-purple-500/30 focus:outline-none focus:border-pink-500 transition-all font-mono text-sm">
          </div>

          <button onclick="adminLogin()" id="adminBtn" class="w-full bg-slate-800 hover:bg-slate-700 border border-purple-500 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg mt-2 transition-all hover:border-pink-500 tracking-wider">
            Access Terminal
          </button>
          
          <div class="h-6 flex items-center justify-center mt-2">
            <p id="adminMsg" class="text-center text-sm font-bold text-red-400"></p>
          </div>

          <p class="text-center text-xs text-slate-400 mt-4 pt-3 border-t border-white/10">
            First time? <button onclick="toggleAdminReg('register')" class="text-pink-400 hover:text-pink-300 font-bold underline">Initialize Master Account</button>
          </p>
        </div>
      </div>

      <!-- Admin Registration View -->
      <div id="admin-reg-view" class="toggle-view hidden-view w-full">
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-purple-300 uppercase tracking-wider mb-1">Master Key</label>
            <input type="password" id="regMaster" autocomplete="new-password" placeholder="Required for Account Creation" class="w-full bg-slate-900/60 text-white px-4 py-2.5 rounded-xl border border-purple-500/30 focus:outline-none focus:border-pink-500 transition-all font-mono text-sm placeholder-red-400/30 border-red-500/30">
          </div>
          <div>
            <label class="block text-xs font-semibold text-purple-300 uppercase tracking-wider mb-1">New Username</label>
            <input type="text" id="regUser" autocomplete="off" placeholder="Assign username" class="w-full bg-slate-900/60 text-white px-4 py-2.5 rounded-xl border border-purple-500/30 focus:outline-none focus:border-pink-500 transition-all font-mono text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-purple-300 uppercase tracking-wider mb-1">New Password</label>
            <input type="password" id="regPass" autocomplete="new-password" placeholder="••••••••" class="w-full bg-slate-900/60 text-white px-4 py-2.5 rounded-xl border border-purple-500/30 focus:outline-none focus:border-pink-500 transition-all font-mono text-sm">
          </div>

          <button onclick="adminRegister()" class="w-full bg-slate-800 hover:bg-slate-700 border border-purple-500 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg mt-2 transition-all hover:border-pink-500 tracking-wider">
            Create Account
          </button>

          <p id="regMsg" class="text-center text-sm font-bold h-5 mt-2"></p>

          <p class="text-center text-xs text-slate-400 mt-4">
            <button onclick="toggleAdminReg('login')" class="text-gray-300 hover:text-white underline">← Return to Login</button>
          </p>
        </div>
      </div>

    </div>
  </div>

  <script>
    let activeRole = 'student';

    function switchRole(role) {
      activeRole = role;
      document.getElementById('tabStudent').classList.toggle('active', role === 'student');
      document.getElementById('tabAdmin').classList.toggle('active', role === 'admin');
      
      if (role === 'student') {
        document.getElementById('student-view').classList.replace('hidden-view', 'active-view');
        document.getElementById('admin-view').classList.replace('active-view', 'hidden-view');
        document.getElementById('admin-reg-view').classList.replace('active-view', 'hidden-view');
      } else {
        document.getElementById('admin-view').classList.replace('hidden-view', 'active-view');
        document.getElementById('student-view').classList.replace('active-view', 'hidden-view');
      }
    }

    function toggleAdminReg(action) {
      if (action === 'register') {
        document.getElementById('admin-view').classList.replace('active-view', 'hidden-view');
        document.getElementById('admin-reg-view').classList.replace('hidden-view', 'active-view');
      } else {
        document.getElementById('admin-reg-view').classList.replace('active-view', 'hidden-view');
        document.getElementById('admin-view').classList.replace('hidden-view', 'active-view');
      }
    }

    async function studentLogin() {
      const studentId = document.getElementById("studentId").value.trim().toUpperCase();
      const password = document.getElementById("studentPass").value.trim();
      const msgEl = document.getElementById("studentMsg");
      const btn = document.getElementById("studentBtn");
      
      if (!studentId || !password) {
        msgEl.innerText = "⚠️ Please enter ID and Password";
        msgEl.className = "text-center text-sm font-bold text-yellow-500";
        return;
      }

      msgEl.innerText = "Authenticating...";
      msgEl.className = "text-center text-sm font-bold text-yellow-500 animate-pulse";
      btn.disabled = true;

      try {
        const res = await fetch("/student/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ studentId, password })
        });
        const data = await res.json();

        if (res.ok) {
          msgEl.innerText = "✅ " + data.message;
          msgEl.className = "text-center text-sm font-bold text-green-400";
          localStorage.setItem("studentAuth", true);
          localStorage.setItem("studentId", data.studentId);
          localStorage.setItem("studentToken", data.token);
          setTimeout(() => { window.location.href = "student-dashboard.html"; }, 800);
        } else {
          msgEl.innerText = "❌ " + (data.error || "Login Failed");
          msgEl.className = "text-center text-sm font-bold text-red-500";
          btn.disabled = false;
        }
      } catch (err) {
        msgEl.innerText = "❌ Network Error";
        msgEl.className = "text-center text-sm font-bold text-red-500";
        btn.disabled = false;
      }
    }

    async function adminLogin() {
      const username = document.getElementById("adminUser").value.trim();
      const password = document.getElementById("adminPass").value.trim();
      const msgEl = document.getElementById("adminMsg");
      const btn = document.getElementById("adminBtn");

      if (!username || !password) {
        msgEl.innerText = "⚠️ Missing credentials";
        return;
      }
      
      msgEl.innerText = "Authenticating Admin...";
      msgEl.className = "text-center text-sm font-bold h-5 mt-2 text-yellow-500 animate-pulse";
      btn.disabled = true;

      try {
        const res = await fetch("/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          msgEl.innerText = "✅ " + data.message;
          msgEl.className = "text-center text-sm font-bold h-5 mt-2 text-green-400";
          localStorage.setItem("adminAuth", true);
          localStorage.setItem("adminUser", data.username);
          localStorage.setItem("adminToken", data.token);
          setTimeout(() => { window.location.href = "admin.html"; }, 800);
        } else {
          msgEl.innerText = "❌ " + (data.error || "Failed");
          msgEl.className = "text-center text-sm font-bold h-5 mt-2 text-red-500";
          btn.disabled = false;
        }
      } catch (err) {
        msgEl.innerText = "❌ Network Error";
        btn.disabled = false;
      }
    }

    async function adminRegister() {
      const masterKey = document.getElementById("regMaster").value.trim();
      const username = document.getElementById("regUser").value.trim();
      const password = document.getElementById("regPass").value.trim();
      const msgEl = document.getElementById("regMsg");

      msgEl.innerText = "Processing...";
      msgEl.className = "text-center text-sm font-bold h-5 mt-2 text-yellow-500 animate-pulse";

      try {
        const res = await fetch("/admin/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, masterKey })
        });
        const data = await res.json();

        if (res.ok) {
          msgEl.innerText = "✅ Account Created!";
          msgEl.className = "text-center text-sm font-bold h-5 mt-2 text-green-400";
          setTimeout(() => {
            toggleAdminReg('login');
            document.getElementById("adminUser").value = username;
          }, 1500);
        } else {
          msgEl.innerText = "⚠️ " + (data.error || "Failed");
          msgEl.className = "text-center text-sm font-bold h-5 mt-2 text-red-400";
        }
      } catch (err) {
        msgEl.innerText = "❌ Network Error";
      }
    }

    document.getElementById("studentPass").addEventListener('keypress', e => { if (e.key === 'Enter') studentLogin(); });
    document.getElementById("adminPass").addEventListener('keypress', e => { if (e.key === 'Enter') adminLogin(); });
  </script>
</body>
</html>
